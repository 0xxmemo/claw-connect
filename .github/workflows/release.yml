name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog generation

      - name: Parse version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          TAG="$GITHUB_REF_NAME"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^$TAG$" | head -1)

          if [[ -z "$PREV_TAG" ]]; then
            echo "Initial release." > /tmp/release-notes.md
          else
            git log --pretty=format:"- %s" "$PREV_TAG".."$TAG" -- | head -50 > /tmp/release-notes.md
          fi

      - name: Update CHANGELOG.md
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          DATE=$(date -u +%Y-%m-%d)
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^$TAG$" | head -1)

          # Build the new entry
          ENTRY="## [$VERSION] - $DATE"$'\n'$'\n'
          if [[ -z "$PREV_TAG" ]]; then
            ENTRY+="Initial release."$'\n'
          else
            ENTRY+=$(git log --pretty=format:"- %s" "$PREV_TAG".."$TAG" -- | head -50)
            ENTRY+=$'\n'
          fi

          # Prepend to CHANGELOG.md (create if missing)
          if [[ -f CHANGELOG.md ]]; then
            # Insert new entry after the header line
            HEADER="# Changelog"
            EXISTING=$(tail -n +2 CHANGELOG.md)
            {
              echo "$HEADER"
              echo ""
              echo "$ENTRY"
              echo "$EXISTING"
            } > CHANGELOG.md
          else
            {
              echo "# Changelog"
              echo ""
              echo "$ENTRY"
            } > CHANGELOG.md
          fi

      - name: Commit CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0  # nothing to commit
          git commit -m "docs: update CHANGELOG for $GITHUB_REF_NAME"
          git push origin HEAD:main

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Claw Connect ${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md
